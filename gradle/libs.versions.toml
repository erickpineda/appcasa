[versions]
agp                    = "9.2.1"
kotlin                 = "2.1.0"
ksp                    = "2.1.0-1.0.29"
kotlinx-serialization  = "1.7.3"
compileSdk             = "35"
targetSdk              = "35"
minSdk                 = "26"
coreKtx                = "1.12.0"
lifecycleRuntimeKtx    = "2.8.7"
activityCompose        = "1.9.3"
composeBom             = "2024.12.01"
navigationCompose      = "2.8.5"
hilt                   = "2.59.2"
hilt-work              = "1.2.0"
hiltNavigationCompose  = "1.2.0"
room                   = "2.8.4"
datastore              = "1.1.1"
workManager            = "2.9.1"
coil                   = "3.0.4"
coroutines             = "1.9.0"
material               = "1.12.0"
lottie                 = "6.4.0"
biometric              = "1.1.0"
google-location        = "21.3.0"
google-services        = "4.4.4"
camerax                = "1.4.0"
mlkit-barcode          = "17.3.0"
mlkit-text             = "19.0.1"
zxing                  = "3.5.3"
firebase-bom           = "34.14.0"
junit                  = "4.13.2"
mockk                  = "1.13.10"
coroutines-test        = "1.9.0"

[libraries]
# Core Android
androidx-core-ktx           = { group = "androidx.core",       name = "core-ktx",                version.ref = "coreKtx" }
lifecycle-runtime-ktx       = { group = "androidx.lifecycle",  name = "lifecycle-runtime-ktx",   version.ref = "lifecycleRuntimeKtx" }
activity-compose            = { group = "androidx.activity",   name = "activity-compose",         version.ref = "activityCompose" }

# Biometric
androidx-biometric          = { group = "androidx.biometric",  name = "biometric",               version.ref = "biometric" }
google-play-location        = { group = "com.google.android.gms", name = "play-services-location", version.ref = "google-location" }

# ML Kit
mlkit-barcode-scanning      = { group = "com.google.mlkit",    name = "barcode-scanning",        version.ref = "mlkit-barcode" }
mlkit-text-recognition      = { group = "com.google.android.gms", name = "play-services-mlkit-text-recognition", version.ref = "mlkit-text" }

# CameraX
androidx-camera-camera2     = { group = "androidx.camera",      name = "camera-camera2",          version.ref = "camerax" }
androidx-camera-lifecycle   = { group = "androidx.camera",      name = "camera-lifecycle",        version.ref = "camerax" }
androidx-camera-view        = { group = "androidx.camera",      name = "camera-view",             version.ref = "camerax" }

# Google Material (Corregido y unificado aquí)
google-material             = { group = "com.google.android.material", name = "material",         version.ref = "material" }

# Compose BOM
compose-bom                 = { group = "androidx.compose",            name = "compose-bom",              version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui",         name = "ui" }
compose-ui-graphics         = { group = "androidx.compose.ui",         name = "ui-graphics" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",         name = "ui-tooling-preview" }
compose-material3           = { group = "androidx.compose.material3",  name = "material3" }
compose-material-icons      = { group = "androidx.compose.material",   name = "material-icons-extended" }
compose-ui-tooling          = { group = "androidx.compose.ui",         name = "ui-tooling" }

# Navigation
navigation-compose          = { group = "androidx.navigation", name = "navigation-compose",       version.ref = "navigationCompose" }

# Hilt
hilt-android                = { group = "com.google.dagger",   name = "hilt-android",             version.ref = "hilt" }
hilt-compiler               = { group = "com.google.dagger",   name = "hilt-android-compiler",    version.ref = "hilt" }
hilt-navigation-compose     = { group = "androidx.hilt",       name = "hilt-navigation-compose",  version.ref = "hiltNavigationCompose" }
hilt-work                   = { group = "androidx.hilt",       name = "hilt-work",                version.ref = "hilt-work" }
hilt-work-compiler          = { group = "androidx.hilt",       name = "hilt-compiler",            version.ref = "hilt-work" }

# Room
room-runtime                = { group = "androidx.room",       name = "room-runtime",             version.ref = "room" }
room-ktx                    = { group = "androidx.room",       name = "room-ktx",                 version.ref = "room" }
room-compiler               = { group = "androidx.room",       name = "room-compiler",            version.ref = "room" }

# DataStore
datastore-preferences       = { group = "androidx.datastore",  name = "datastore-preferences",   version.ref = "datastore" }

# WorkManager
workmanager-ktx             = { group = "androidx.work",       name = "work-runtime-ktx",         version.ref = "workManager" }

# Coil
coil-compose                = { group = "io.coil-kt.coil3",   name = "coil-compose",              version.ref = "coil" }

# Coroutines
coroutines-android          = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
lottie-compose              = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie" }
zxing-core                  = { group = "com.google.zxing",   name = "core",           version.ref = "zxing" }

# Firebase
firebase-bom                = { group = "com.google.firebase", name = "firebase-bom",            version.ref = "firebase-bom" }
firebase-auth               = { group = "com.google.firebase", name = "firebase-auth" }
firebase-firestore          = { group = "com.google.firebase", name = "firebase-firestore" }
firebase-messaging          = { group = "com.google.firebase", name = "firebase-messaging" }
firebase-analytics          = { group = "com.google.firebase", name = "firebase-analytics" }

# Build logic dependencies
android-gradlePlugin        = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin         = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin        = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
hilt-gradlePlugin           = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }
ksp-gradlePlugin            = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }

junit                       = { group = "junit",               name = "junit",                   version.ref = "junit" }
mockk                       = { group = "io.mockk",            name = "mockk",                   version.ref = "mockk" }
coroutines-test             = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines-test" }
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

[plugins]
android-application   = { id = "com.android.application",             version.ref = "agp" }
android-library       = { id = "com.android.library",                 version.ref = "agp" }
kotlin-android        = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                  = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
ksp                   = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
google-services       = { id = "com.google.gms.google-services",      version.ref = "google-services" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Configuraciones de rendimiento y compatibilidad actuales
android.dependency.excludeLibraryComponentsFromConstraints=true
android.r8.strictFullModeForKeepRules=false

# Nota: Las propiedades obsoletas de comportamiento antiguo se han removido 
# para que Android Gradle Plugin aplique los valores por defecto modernos.
